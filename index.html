		</article>
	</main>
	<!-- Etapa 19: deixa os arquivos de áudio disponíveis ao JavaScript sem mostrar controles na página. -->
	<audio id="lula-audio" src="./assets/lula-audio.mp3" preload="none" hidden></audio>
	<audio id="flavio-audio" src="./assets/bolsonaro-audio.mp3" preload="none" hidden></audio>
	<!-- Etapa 16: footer contém o crédito no fim do conteúdo e acompanha a rolagem da página. -->
